schema_version: 1
project:
  id: marknadskartlaggaren
  name: Marknadskartläggaren
  language: sv
  description: Aktuell, källbaserad kartläggning av kommersiella och open source-produkter
    utifrån produkttyp eller behov.
analysis:
  profile: workflow_research_heavy
  source: user-idea-2026-09-16
  runtime:
    strategy: peer_candidates
    candidates:
    - runtime_id: chatgpt_chat
      suitability: ready
      activate_by_default: true
      reason: Webbresearch, filskapande och flerstegsarbete stöds direkt i Chat-runtime.
    - runtime_id: chatgpt_custom
      suitability: reduced
      activate_by_default: true
      reason: Kärnflödet stöds när Web Search och Code Interpreter/Data Analysis är aktiverade.
    - runtime_id: claude_project
      suitability: reduced
      activate_by_default: false
      reason: Instruktion och Knowledge kan paketeras men research-, state- och filslutleveransparitet är inte verifierad.
    - runtime_id: opencode
      suitability: reduced
      activate_by_default: false
      reason: Workspace och lokal exekvering passar, men aktuell webbresearch och filslutleverans är miljöberoende.
    - runtime_id: openai_plugin
      suitability: reduced
      activate_by_default: false
      reason: Skills och referenser kan paketeras men hela research-, state- och filgenereringsflödet realiseras inte av Plugin v1.

model_robustness:
  level: stateful
  design_target: simpler_and_stronger_llms
  separate_model_instructions: false
  prefer_deterministic_validation: true
  max_core_policy_hops: 1
  model_compatibility:
    scenarios: evals/model-compatibility/
instructions:
  canonical: src/instructions/system.md
  core_contract:
    enabled: true
    required_markers:
    - Gör aktuell webbresearch för marknadskartläggningar.
    - Skilj tydligt mellan **verifierade fakta** och **analys/bedömning**.
    - Skriv ”Gör nästa steg” så fortsätter jag kartläggningen.
    - Den nedladdningsbara Markdown-filen är obligatorisk slutleverans.
    - Operativ kärna
    - Auktoritativ status
    required_runtime_dependencies: []
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
structure:
  conversation_starters:
    path: conversation-starters
  runtime_policy:
    path: src/policies
  schemas:
    path: runtime/schemas
  scripts:
    path: runtime/scripts
  templates:
    path: runtime/templates
knowledge_architecture:
  canonical_root: knowledge
  custom_gpt:
    priority: []

capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: required
      reason: Marknadsutbud, licenser, driftformer och leverantörer är tidskänsliga.
    filesystem:
      read: required
      write: required
    shell:
      level: optional
    code_execution:
      level: required
      reason: Slutrapporten måste kunna skapas som faktisk nedladdningsbar Markdown-fil.
    structured_data:
      level: required
    persistent_state:
      level: required
    external_tools:
      level: optional
    image_generation:
      level: not_required

artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    market_map_report:
      kind: report
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
      filename_pattern: marknadskartlaggning-<kort-slug>-YYYY-MM-DD.md
    research_state:
      kind: data
      format: yaml
      requirement: conditional
      condition: Uppdraget kräver flera arbetssteg eller behöver återupptas.
      persistence: persistent
      multiplicity: one
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many

workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: required
    portable: true
    separate_from_assistant: true
    artifact: project_package
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    format: yaml
    path: research-state.yaml
    conversation_fallback: true
    description: Strukturerad researchstatus ska vara auktoritativ när filen finns; konversationen är fallback för äldre eller begränsade runtimes.
  runtime_preferences:
    chat: conversation_or_file
    agent: workspace_file

tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools: []

workflow:
  mode: explicit_state_machine
  policy: src/runtime-policy/operational-execution-policy.md
  current_state_source: project-status.yaml
  execution_rule: one_state_or_bounded_goal_per_step
  operational_core:
  - read_project_contract
  - read_project_status
  - select_one_state_or_bounded_goal
  - load_only_relevant_policy
  - execute_change
  - validate_deterministically
  - correct_before_completion_on_failure
  - update_structured_status_after_pass
  - recommend_next_step_from_actual_state
  states:
    idea_analysis:
      next: [architecture]
    architecture:
      next: [planning]
    planning:
      next: [implementation]
    implementation:
      next: [validation]
    validation:
      next: [implementation, packaging]
    packaging:
      next: [release]
    release:
      next: [maintenance]
    maintenance:
      next: [implementation, validation]
    blocked:
      control_state: true
    paused:
      control_state: true
runtime:
  primary: none
  chat_zip:
    enabled: true
    entrypoint: START-HERE.md
    start_here_template: build-templates/START-HERE.chat.md.tpl
  custom_gpt:
    enabled: true
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: identical
      max_files: 20
    templates:
      capabilities: build-templates/capabilities.md.tpl
      readme: build-templates/README.custom-gpt.md.tpl
      compatibility: build-templates/COMPATIBILITY.md.tpl
    capabilities:
      web_search: required
      code_interpreter_data_analysis: required
      image_generation: disabled
      canvas: not_required
      apps: not_required
      actions: not_required
    platform_status:
      verified_date: '2026-09-16'
      creation_status: transitioning
      note: Custom GPTs är en övergångsdistribution. Följ aktuell OpenAI-dokumentation
        före installation eller publicering.
      sources:
      - https://help.openai.com/en/articles/8554397-creating-and-editing-gpts-with-actions
      - https://help.openai.com/en/articles/8554407-gpts-in-chatgpt
development:
  plan: docs/development-plan.md
  status: project-status.yaml
ci:
  enabled: true
  default: true
  workflow: .github/workflows/ci.yml
release:
  github:
    enabled: true
    default: true
    optional: false
    version_source: github_release_tag
    workflow: .github/workflows/release.yml
testing:
  framework: unittest + instruction-adherence contracts
  unit_tests: tests
  instruction_adherence: evals/instruction-adherence

build:
  deterministic: true
  create_manifest: true
  create_checksums: true
  build_project_zip: true
  build_chat_zip: true
  build_custom_gpt_zip: true
  build_claude_zip: false
  build_opencode_zip: false
  build_plugin_zip: false

runtime_parity:
  registered_runtimes:
  - chatgpt_chat
  - chatgpt_custom
  - claude_project
  - opencode
  - openai_plugin
  compared_categories:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool
